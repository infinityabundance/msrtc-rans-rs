[workspace]
resolver = "2"
members = [
    "crates/msrtc-rans-core",
    "crates/msrtc-rans",
    "crates/msrtc-rans-python",
    "crates/msrtc-rans-oracle",
    "crates/msrtc-rans-casefile",
    "crates/msrtc-rans-court",
    "crates/msrtc-rans-bench",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/infinityabundance/msrtc-rans-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
paste = "1"
